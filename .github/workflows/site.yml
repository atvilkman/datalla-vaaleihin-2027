# Refresh the data from api.eduskunta.fi and publish the site on GitHub Pages (free for public repos).
name: refresh-and-publish
on:
  schedule:
    - cron: "15 3 * * *"        # every morning (≈ 06:15 Finnish time)
    - cron: "30 17 * * 2-5"     # plenary days Tue–Fri, after the afternoon votes
  workflow_dispatch: {}          # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**", "edk/**", "run.py", ".github/workflows/site.yml"]
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write            # commit the daily data snapshot (audit trail)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Restore cached raw data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Collect data from Eduskunta
        run: |
          python run.py --user-agent "DataBasedVoting2027/1.0 (contact: ${{ vars.CONTACT_EMAIL }})"
      - name: Build site
        run: python site/build_site.py --data data --out public/index.html --json site-data/latest.json
      - name: Commit data snapshot if it changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add site-data/latest.json site-data/scorecard.json
          git diff --cached --quiet || (git commit -m "Data update $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
